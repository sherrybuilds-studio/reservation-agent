name: CI

on:
  push:
  pull_request:

# Read-only token: nothing in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit tests, retrieval eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANONYMIZED_TELEMETRY: "False" # chromadb usage telemetry off
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # CPU-only torch keeps the install small; sentence-transformers would otherwise pull the CUDA build.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests (offline, no secrets)
        run: pytest -q

      - name: Cache the embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Build the retrieval index from data/menu.json
        run: python -m rag.indexer

      # Exits 1 when fewer than THRESHOLD_PCT of the gold questions pass.
      - name: Retrieval eval
        run: python -m tests.eval
